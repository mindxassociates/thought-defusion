 "▤"], ["Close a browser window", "Picture your mind as a screen with many open windows. When you’re ready, imagine clicking the X on one window at a time. You don’t have to close every thought.", "Close a window", "▣"], ["Name the story", "Some thoughts return as familiar stories: “I always fail,” “No one likes me,” or “Everything is awful.” Naming the story can help you recognize a recurring pattern.", "Reveal a story", "↻"], ["Use a silly voice", "Write down an upsetting thought and, if it feels okay, read it aloud in a playful voice several times. Or just imagine the voice. Changing the sound can make the thought feel less gripping.", "Try a playful voice", "♫"], ["Watch the screen", "Imagine the thought as a scene on a movie screen. Picture yourself sitting in the back row, watching what unfolds without needing to enter the scene.", "Take the back row", "▰"], ["Zoom out", "Picture yourself rising above the earth. From farther away, notice the thought and the wider landscape around it. You don’t need to decide its importance—just see it in context.", "Change the view", "◉"]], "note": "Defusion isn’t about proving a thought false or forcing it away. It’s a way to make room for the thought while choosing where to place your attention next.", "end": "A thought is something your mind is doing—not the whole of you.", "endDesc": "After trying a practice, notice what’s here now. Is there one small action that would move you toward what matters, even with the thought still in the background?", "back": "Back to the practices ↑", "footer": "Developed by Mind X Associates", "cloud": "“I can’t handle this.”", "story": "“I always get it wrong.”", "screen": "A difficult moment…", "close": "Predicting · Regretting · Comparing · Doubting", "endName": "Back to top"}, "zh-Hans": {"lang": "zh-Hans", "brand": "认知解融合", "theme": "◐ 深色模式", "print": "打印 / 保存为 PDF", "nav": ["从这里开始", "什么时候可以试试", "练习一下"], "eyebrow": "给思绪繁忙时的一个温和练习", "shortTitle": "认知解融合", "title": "你可以看见一个想法，而不被它带着走。", "l
